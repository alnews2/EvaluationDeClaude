name: Construction des exécutables

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les bibliothèques système requises par Qt6
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1
      - name: Installer les dépendances
        run: pip install -e ".[dev]"
      - name: Lancer les tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -v

  construction:
    needs: tests
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            nom_artefact: Calculatrice-linux-x86_64
            nom_fichier: Calculatrice
          - os: windows-latest
            nom_artefact: Calculatrice-windows-x86_64
            nom_fichier: Calculatrice.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances
        run: pip install -e ".[dev]" pyinstaller
      - name: Construire l'exécutable
        run: pyinstaller --name Calculatrice --onefile --windowed --paths src src/calculatrice/fenetre.py
      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nom_artefact }}
          path: dist/${{ matrix.nom_fichier }}

  publier_release:
    needs: construction
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artefacts
      - name: Préparer les fichiers de release
        run: |
          mkdir -p release
          cp artefacts/Calculatrice-linux-x86_64/Calculatrice release/Calculatrice-linux-x86_64
          cp artefacts/Calculatrice-windows-x86_64/Calculatrice.exe release/Calculatrice-windows-x86_64.exe
          chmod +x release/Calculatrice-linux-x86_64
      - name: Créer ou mettre à jour la release "dernieres-constructions"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail

          TAG="dernieres-constructions"
          TITRE="Dernières constructions (mise à jour automatique)"
          NOTES="Exécutables générés automatiquement à chaque évolution poussée sur main."
          TENTATIVES_MAX=3
          DELAI_SECONDES=20

          for tentative in $(seq 1 "$TENTATIVES_MAX"); do
            echo "::group::Tentative $tentative / $TENTATIVES_MAX"

            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" \
                release/Calculatrice-linux-x86_64 \
                release/Calculatrice-windows-x86_64.exe \
                --clobber
            else
              gh release create "$TAG" \
                release/Calculatrice-linux-x86_64 \
                release/Calculatrice-windows-x86_64.exe \
                --title "$TITRE" \
                --notes "$NOTES"
            fi
            resultat=$?
            echo "::endgroup::"

            if [ "$resultat" -eq 0 ]; then
              echo "Publication réussie (tentative $tentative)."
              exit 0
            fi

            if [ "$tentative" -lt "$TENTATIVES_MAX" ]; then
              echo "Échec (probablement transitoire). Nouvelle tentative dans ${DELAI_SECONDES}s..."
              sleep "$DELAI_SECONDES"
            fi
          done

          echo "Échec de la publication après $TENTATIVES_MAX tentatives."
          exit 1
